<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balloon Bot — S3 Harness (serial-fed WS)</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">BALLOON BOT</div>
        <div class="brand-sub">GROUND CONTROL</div>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <a href="#/overview">Overview</a>
        <a href="#/gps">GPS Tracking</a>
        <a href="#/atmospheric">Atmospheric Data</a>
        <a href="#/events">Event Analysis</a>
        <a href="#/comm">Communication</a>
        <a href="#/logs">Data Logs</a>
        <a href="#/settings">Settings</a>
      </nav>
    </aside>

    <header class="topbar">
      <div class="topbar-mission" id="tb-mission" title="Mission name">—</div>
      <div class="topbar-stale" id="tb-stale" hidden>
        <span class="stale-label">⚠ TELEMETRY STALE</span>
        <span class="stale-ago mono" id="tb-stale-ago">00:00</span>
        <span class="stale-hint">since last packet</span>
      </div>
      <div class="topbar-cluster">
        <div class="tb-item" title="Elapsed mission time">
          <span class="tb-label">MISSION</span>
          <span class="tb-value mono" id="tb-elapsed">—</span>
        </div>
        <div class="tb-item" title="Time since last received packet">
          <span class="tb-label">LAST PKT</span>
          <span class="tb-value mono" id="tb-lastpkt">—</span>
        </div>
        <div class="tb-chip" id="tb-mode" title="Operating mode">—</div>
        <div class="tb-chip link" id="tb-link" title="Radio link status">
          <span class="dot"></span>
          <span class="tb-value" id="tb-link-label">NO LINK</span>
        </div>
        <div class="tb-chip battery ok" id="tb-battery" title="Battery">
          <span class="tb-value mono" id="tb-battery-val">—</span>
          <span class="battery-bar"><span id="tb-battery-fill"></span></span>
        </div>
      </div>
    </header>

    <main class="page-root" id="page-root"></main>
    <div class="radio-readout" id="radio-readout">RADIO: —</div>
    <link rel="stylesheet" href="/hold?wait=__WAIT__">
  </div>

  <script type="module">
    import { store } from './js/store.js';
    import { TelemetryLink } from './js/link.js';
    import { fmtDuration, fmtAgo } from './js/format.js';
    import { renderOverview } from './js/pages/overview.js';

    // Bind the top bar (replicating main.js bindTopBar).
    const s = store.state;
    const els = {
      mission: document.getElementById('tb-mission'),
      elapsed: document.getElementById('tb-elapsed'),
      lastPkt: document.getElementById('tb-lastpkt'),
      mode: document.getElementById('tb-mode'),
      link: document.getElementById('tb-link'),
      linkLabel: document.getElementById('tb-link-label'),
      battery: document.getElementById('tb-battery'),
      batteryVal: document.getElementById('tb-battery-val'),
      batteryFill: document.getElementById('tb-battery-fill'),
      stale: document.getElementById('tb-stale'),
      staleAgo: document.getElementById('tb-stale-ago'),
    };
    const setLink = () => {
      let label, cls;
      if (s.source === 'simulator') { label = 'SIM'; cls = 'ok'; }
      else if (s.wsState === 'connecting') { label = 'CONNECTING'; cls = 'warn'; }
      else if (s.wsState === 'open' && s.stale) { label = 'STALE'; cls = 'warn'; }
      else if (s.wsState === 'open') { label = 'LINK'; cls = 'ok'; }
      else { label = 'NO LINK'; cls = 'fault'; }
      els.linkLabel.textContent = label;
      els.link.className = `tb-chip link ${cls}`;
    };
    const onTick = now => {
      const launchTs = s.session.launchTs;
      els.elapsed.textContent = launchTs ? fmtDuration(now - launchTs) : '—';
      els.lastPkt.textContent = s.link.lastPacketAt ? fmtAgo(now - s.link.lastPacketAt) : '—';
      if (s.stale) { els.stale.hidden = false; els.staleAgo.textContent = fmtAgo(now - s.link.lastPacketAt); }
      else { els.stale.hidden = true; }
    };
    const onTelemetry = p => {
      els.mode.textContent = p.mode;
      els.mode.className = `tb-chip mode-${p.mode.toLowerCase()}`;
      if (p.battery_pct != null) {
        els.batteryVal.textContent = `${Math.round(p.battery_pct)}%`;
        els.batteryFill.style.width = `${Math.max(0, Math.min(100, p.battery_pct))}%`;
        const cls = p.battery_pct < 10 ? 'fault' : p.battery_pct < 20 ? 'warn' : 'ok';
        els.battery.className = `tb-chip battery ${cls}`;
      }
    };
    const onHello = d => { els.mission.textContent = d.mission || s.settings.missionName; };
    store.on('tick', onTick);
    store.on('telemetry', onTelemetry);
    store.on('hello', onHello);
    store.on('link-state', setLink);
    store.on('stale', v => { document.body.classList.toggle('stale', v); setLink(); });
    els.mission.textContent = s.settings.missionName;
    setLink();
    onTick(Date.now());

    // Show the radio link state from `link` frames (the S3 watchdog path).
    const radioEl = document.getElementById('radio-readout');
    const t0page = Date.now();
    window.__wslog = [];
    const logEv = tag => { window.__wslog.push(`${Math.round((Date.now() - t0page) / 1000)}s ${tag}`); };
    store.on('link', d => { radioEl.textContent = `RADIO: ${(d.radio || '—').toUpperCase()}`; logEv(`link ${d.radio}`); });
    store.on('telemetry', p => logEv(`telemetry seq=${p.seq}`));
    store.on('link-state', () => logEv(`ws=${store.state.wsState} src=${store.state.source}`));

    // Boot the link and connect to the serial-fed WS server (NO simulator).
    const link = new TelemetryLink(store);
    link.startTicker();
    renderOverview(document.getElementById('page-root'));
    store.state.settings.staleSec = 3; // faster stale banner for screenshot timing
    store.emit('connect-ws', 'ws://localhost:8801/ws');

    // The static /hold?wait=N stylesheet blocks rendering for N ms (server
    // sleeps), so the headless screenshot happens N ms after the WS client
    // connected — real time, not virtual-time-budget (see pitfalls).
    window.__s3 = { store };
  </script>
</body>
</html>
